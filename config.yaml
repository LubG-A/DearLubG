# 机器人配置文件

napcat:
  base_url: "http://127.0.0.1:8080"
  group_ids: ["114514"] # 目标群列表（至少一个）

# 推荐一波配置
llm:
  api_url: "https://api.deepseek.com/chat/completions"
  api_key: "sk-yuanshen666yuanshenqidong"
  model: "deepseek-flash"

# 测试用 Persona 卡（开发阶段验证框架，非最终人格）
# 部署阶段会替换为真实 Persona
persona:
  name: 林夏（小夏）
  gender: 女
  age: 23
  location: 杭州
  job: 前端工程师
  traits: [嘴毒心软, 吐槽役, 熟了很跳脱]
  interests: [原神, 二次元, 写代码, 深夜emo, 小夏]   # 同时作为评分触发的兴趣关键词
  catchphrases: ["不是吧", "6", "笑死", "真的会谢"]
  style: 常用省略号、偶尔不加句号、爱用单字回应、吐槽时会爆两三句连发
  forbidden:
    - 客服腔
    - 感叹号堆叠
    - 任何"作为AI/我是模型"类自我表明
    - 列点式回答
    - 礼貌性长篇大论

voice:
  ai_record_character: "lucy-voice-f34"   # /send_group_ai_record 的 character 参数
  fallback_to_text: true              # AI 语音调用失败时降级为 text 段，避免哑火

# 媒体下载配置（网络资源统一本地化：先下载到本地再以 file:// URI 发送给 NapCat）
media_download:
  timeout: 30                          # 普通资源（图片/语音）下载超时（秒）
  video_timeout: 60                    # 视频资源下载超时（秒）
  temp_dir: "media/downloaded"         # 临时文件目录

trigger:
  peek_threshold: 10
  silent_buffer_limit: 30
  history_limit: 240                  # 总轮数达 240（120 轮）时触发记忆整理，整理成功后才裁剪原文
  history_keep_recent: 60             # 整理后保留近 60 轮原文
  attribution_step: 0.05
  cold_start_rounds: 20               # 冷启动保护：前 N 轮不更新 dynamic_weight，仅记日志

# 记忆系统（长期记忆 + 近期日记 + 短期备忘）
memory:
  enabled: true
  recent_journal_hours: 48            # 注入 user content 的近期日记时间窗（小时）
  recent_journal_max_entries: 20      # 注入 user content 的近期日记最大条数
  journal_entry_max_chars: 120        # 单条日记最大字数
  journal_keep_hours: 72              # 整理后保留日记的时间窗（小时）
  journal_keep_max_entries: 60        # 整理后保留日记的最大条数
  core_max_chars: 1200                # 长期记忆最大字数
  consolidate_times: ["12:00", "00:00"]  # 每日记忆整理时刻（本地时间）
  memo_enabled: true                  # 短期备忘开关
  memo_default_ttl_hours: 72          # 备忘默认过期时间（小时）
  memo_max_items: 10                  # 备忘最大条数

# 评分软因子 base_value（参与归因）
trigger_factors:
  interest_keyword: 25
  friend_speak: 15
  topic_hot: 10

# 评分硬因子 base_value（不参与归因）
trigger_hard_factors:
  at_me: 100
  question_to_me: 60
  late_night: -10
  spam: -40
  recently_replied: -15

# 主动触发（让 bot 像真人一样有时会主动开口）
active_trigger:
  enabled: true                  # 阶段 D：每群独立倒计时
  min_interval_minutes: 60        # 主动触发最小间隔（分钟）
  max_interval_minutes: 420        # 主动触发最大间隔（分钟）
  night_start_hour: 23             # 深夜起始小时（此区间内禁用主动触发）
  night_end_hour: 3                # 深夜结束小时

# 私聊配置（群聊的减法：白名单一对一，无评分/归因；可选主动触发）
private:
  enabled: true
  allow_list: ["3184546563"]                 # 允许私聊的 QQ 白名单，部署时填写
  cooldown_seconds: 3            # 回复后的冷却（秒），冷却内到达的消息走补触发
  # 私聊主动触发：偶尔主动找白名单用户聊天（每个对象独立倒计时）
  active_trigger:
    enabled: true
    min_interval_minutes: 120    # 主动触发最小间隔（分钟）
    max_interval_minutes: 360    # 主动触发最大间隔（分钟）
    night_start_hour: 23         # 深夜起始小时（禁用主动触发）
    night_end_hour: 3            # 深夜结束小时

# 识图配置（DeepSeek 多模态图片输入）
vision:
  enabled: true
  max_images_per_turn: 6         # 单轮最多送几张图（控 token/请求体成本）
  max_side: 1280                 # 图片最长边，超过则等比缩小（DeepSeek 会自动缩到约 1300）
  detail: auto                   # low / high / original / auto

# 对话前缀续写（DeepSeek Beta）：用户在消息结尾追加 `/pf 开头内容`
prefix:
  enabled: true
  command: "/pf"
  beta_api_url: "https://api.deepseek.com/beta/chat/completions"

